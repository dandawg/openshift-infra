[project]
name = "openshift-infra-deploy"
version = "0.1.0"
description = "Deployment CLIs for openshift-infra (AWS MachineSets, EFS + Argo CD)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1,<9",
]

[project.scripts]
openshift-infra-machineset-aws = "openshift_infra_deploy.cli_machineset_aws:main"
openshift-infra-efs-aws = "openshift_infra_deploy.cli_efs:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openshift_infra_deploy"]

[tool.uv]
package = true
